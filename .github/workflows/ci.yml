name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm audit --audit-level=high

  firestore-rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - run: npm run test:rules

  storage-rules:
    name: Storage rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - run: npm run test:storage-rules

  functions:
    name: Cloud Functions lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
        working-directory: functions

      - run: npm run lint
        working-directory: functions

      - run: npm run typecheck
        working-directory: functions

      - run: npm run test
        working-directory: functions

      - run: npm run build
        working-directory: functions

  deploy-hosting:
    name: Deploy to Firebase Hosting
    # Only on a real push to main, never for PRs - PALLETIQ-015 is a
    # merge-to-main deploy, not a preview-channel workflow.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-typecheck-test, firestore-rules, storage-rules]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MRT_PALLET_IQ }}
          projectId: mrt-pallet-iq
          channelId: live
