name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm audit --audit-level=high

  firestore-rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - run: npm run test:rules

  storage-rules:
    name: Storage rules tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - run: npm run test:storage-rules

  e2e:
    name: Playwright e2e (emulator-backed)
    # PALLETIQ-051/ADR-0017. Non-blocking while this new integration
    # surface (emulator seam, seed helper, build/serve wiring) earns a
    # track record - not in deploy-hosting's needs, not a required check
    # in branch protection yet. Revisit once green for a stretch.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - run: npm ci
        working-directory: functions

      - run: npx playwright install --with-deps chromium

      - name: Dummy params/secrets for the functions emulator's cold start
        run: |
          echo "GEMINI_API_KEY=dummy" >> functions/.secret.local
          echo "STRIPE_SECRET_KEY=dummy" >> functions/.secret.local
          echo "STRIPE_WEBHOOK_SECRET=dummy" >> functions/.secret.local
          echo "STRIPE_PRO_PRICE_ID=price_dummy" >> functions/.env.local

      - run: npm run test:e2e

  functions:
    name: Cloud Functions lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
        working-directory: functions

      - run: npm run lint
        working-directory: functions

      - run: npm run typecheck
        working-directory: functions

      - run: npm run test
        working-directory: functions

      - run: npm run build
        working-directory: functions

  deploy-hosting:
    name: Deploy to Firebase Hosting
    # Only on a real push to main, never for PRs - PALLETIQ-015 is a
    # merge-to-main deploy, not a preview-channel workflow.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint-typecheck-test, firestore-rules, storage-rules]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          # Firebase web config is not a secret by design (security is
          # Auth + Firestore/Storage rules, not hiding this key) - stored as
          # repo secrets anyway only because .env is gitignored locally and
          # this is the existing mechanism for getting values into a build.
          # Without these, Vite bakes `undefined` into every VITE_FIREBASE_*
          # reference and the deployed app fails with auth/invalid-api-key.
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MRT_PALLET_IQ }}
          projectId: mrt-pallet-iq
          channelId: live
